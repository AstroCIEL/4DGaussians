# default.yaml
# 真实 workload：根据 dataset/scene/frames 加载训练好的 4DGS 模型，渲染得到每 tile 高斯数以驱动仿真。
# 若 model_path 不存在或 workload.use_synthetic=true，则使用合成（平均分配）workload。
simulation:
  dataset: "dynerf"
  # 要仿真的帧（camera/view）索引，单帧写 0，多帧写 0,1,2
  frames: 0,1,2,3,4
  resolution: "1440x1024"   # 仅合成 workload 时使用；真实 workload 由视图分辨率决定
  # 可选：直接指定模型与数据路径；不填则用 base_output/dataset/scene 与 data/dataset/scene
  # model_path: "output/dynerf/sear_steak"
  # source_path: "data/dynerf/sear_steak"
  iteration: -1
  camera_split: "video"   # video | test | train
  base_output: "output"  # 模型根目录，用于推导 model_path = base_output/dataset/scene

hardware:
  clock_frequency: 1.0  # GHz
  udpe: 
    cull_cycles: 2.0              # 单高斯 cull 开销
    deform_cycles: 6.0            # 单高斯 deform 开销
    intersection_cycles: 2.0      # 单高斯 intersection 开销
    fifo_depth: 2                 # FIFO 深度（frame粒度）
    skip_enabled: false
  hse:
    num_cores: 16                 # 排序核数
    coarse_sort_cycles: 8.0       # 粗排序（pivot分chunk）周期
    fine_sort_cycles: 10.0        # 细排序（chunk内双调排序）周期
  fre:
    num_cores: 16                 # 光栅化核数
    base_cycles_per_gaussian: 8.0 # 单高斯基础光栅化周期
    interpolation_cycles: 64.0    # 插值周期（每个tile）
  wbs:
    window_size_k: 32             # 窗口大小
    fifo_depth: 2                # FIFO 深度
    scheduling_mode: "default_fifo" # "hilbert_window" | "default_fifo" | "global_greedy"
  memory:
    memory_bandwidth: 51.2         # GB/s
    cache_size: 1048576           # bytes
    bytes_per_gaussian: 240       # 内存估算用的单高斯读写字节
    read_latency_hiding_rate: 0.3
  
algorithm:
  # tile_size 32 means 32x32px
  tile_size: 32
  subtile_size: 2
  early_stop_ratio: 0.7
  fov_x: 90          # 水平视场角(度)用于区域划分
  foveated_enabled: false  # 关闭则全部视为fovea，不做降采样

# workload：不设 use_synthetic 且存在模型时使用真实负载；否则合成
workload:
  chunk_size: 256
  # use_synthetic: true   # 设为 true 强制使用合成 workload
  # num_gaussians: 100000  # 仅合成时有效
  static_ratio: 0.4
  quasi_ratio: 0.4
  culling_survival_rate: 0.8
  
labeling:
  num_time_samples: 50
  output_npy: "motion_labels.npy"
  output_json: "motion_labels.json"
  
output:
  stats_file: "simulator/results/gscore_dynerf_stats.json"
  verbose: True