# merge with default.yaml
simulation:
  dataset: "dynerf"
  scene: "sear_steak"

hardware:
  udpe: 
    udpe_utilization: 0.35
    skip_enabled: false
  wbs:
    scheduling_mode: "default_fifo" # "hilbert_window" | "hilbert_fifo" | "default_fifo" | "global_greedy"
  memory:   
    read_latency_hiding_rate: 0.5
  
algorithm:
  early_stop_ratio: 0.4
  foveated_enabled: false  # 关闭则全部视为fovea，不做降采样
  
output:
  stats_file: "simulator/results/scene_stats.json"
  csv_file: "simulator/results/scene_log.csv"